<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0b12">
<title>Decibel 2026 · Horarios</title>
<style>
:root{
  --bg:#0b0b12; --bg2:#12121d; --card:#1a1a28; --card2:#202032;
  --line:#2a2a40; --txt:#f2f2f8; --dim:#8d8da8;
  --acc:#ffd400; --acc2:#00e5ff; --must:#22c55e; --like:#38bdf8; --clash:#ff4d4d;
  --slot:24px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overscroll-behavior-x:none}
body{padding-bottom:env(safe-area-inset-bottom)}
button{font-family:inherit}

header{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,#0b0b12 70%,rgba(11,11,18,.92));backdrop-filter:blur(8px);padding:10px 14px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:8px}
.brand h1{font-size:20px;letter-spacing:3px;font-weight:800}
.brand h1 b{color:var(--acc)}
.brand span{font-size:11px;color:var(--dim);letter-spacing:1px}
.mebtn{margin-left:auto;background:var(--card);border:1px solid var(--line);color:var(--txt);font-size:11px;font-weight:700;border-radius:14px;padding:4px 10px}
.mebtn i{font-style:normal;display:inline-block;width:16px;height:16px;line-height:16px;border-radius:50%;text-align:center;font-size:9px;font-weight:800;color:#111;margin-right:4px;vertical-align:-3px}
.tabs{display:flex;gap:6px;margin:10px 0}
.tabs button{flex:1;background:var(--card);border:1px solid var(--line);color:var(--dim);border-radius:10px;padding:8px 4px;font-size:13px;font-weight:700;letter-spacing:.5px}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#111}
.views{display:flex;gap:12px;padding:2px 2px 8px;align-items:center}
.views button.v{background:none;border:none;color:var(--dim);font-size:12px;font-weight:700;letter-spacing:1px;padding:4px 2px;border-bottom:2px solid transparent}
.views button.v.on{color:var(--txt);border-color:var(--acc2)}
.views .cnt{display:inline-block;min-width:16px;padding:0 4px;border-radius:8px;background:var(--must);color:#08130b;font-size:10px;margin-left:3px}
.filterbtn{margin-left:auto;background:var(--card);border:1px solid var(--line);color:var(--txt);font-size:12px;border-radius:14px;padding:4px 10px;font-weight:700}
.filterbtn.active{border-color:var(--acc2);color:var(--acc2)}

#grid{padding:8px 0 30px}
.section{margin:0 0 22px}
.sec-title{padding:6px 14px;font-size:12px;font-weight:800;letter-spacing:2px;color:var(--acc2)}
.gridwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.gtable{display:grid;position:relative}
.timecol{position:sticky;left:0;z-index:20;background:var(--bg);border-right:1px solid var(--line)}
.tlabel{height:calc(var(--slot)*4);font-size:10px;color:var(--dim);padding:2px 6px 0 10px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.stagehead{z-index:10;background:var(--bg2);font-size:10px;font-weight:800;letter-spacing:.5px;padding:7px 6px;text-align:center;border-left:1px solid var(--line);border-bottom:2px solid var(--sc,#555);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:sticky;top:0}
.stagecol{position:relative;border-left:1px solid var(--line);background:
  repeating-linear-gradient(180deg,transparent 0,transparent calc(var(--slot)*4 - 1px),var(--line) calc(var(--slot)*4 - 1px),var(--line) calc(var(--slot)*4))}
.set{position:absolute;left:3px;right:3px;background:var(--card);border-radius:7px;border-left:3px solid var(--sc,#888);
  padding:4px 5px;font-size:10.5px;line-height:1.25;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:1px}
.set .t{color:var(--dim);font-size:9px;font-variant-numeric:tabular-nums}
.set.must{background:linear-gradient(135deg,#153420,#1c4429);border-left-color:var(--must);box-shadow:0 0 0 1px var(--must) inset}
.set.like{background:linear-gradient(135deg,#122b3a,#173a4e);border-left-color:var(--like);box-shadow:0 0 0 1px var(--like) inset}
.set.clash{box-shadow:0 0 0 1px var(--clash) inset}
.set.past{opacity:.45}
.set.nowplay{border-left-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:2px;margin-top:2px}
.chip{display:inline-block;min-width:15px;height:15px;line-height:13px;padding:0 3px;border-radius:8px;font-size:8.5px;font-weight:800;text-align:center;background:var(--uc);color:#111;border:1px solid var(--uc)}
.chip.like{background:transparent;color:var(--uc)}
.chip.me{outline:1.5px solid #fff}

.list{padding:10px 14px 40px;display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center}
.card .when{min-width:64px;text-align:center}
.card .when b{display:block;font-size:14px;color:var(--acc);font-variant-numeric:tabular-nums}
.card .when span{font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums}
.card .who{flex:1;min-width:0}
.card .who b{display:block;font-size:13px;line-height:1.3}
.card .who span.st{font-size:11px;color:var(--dim);letter-spacing:.5px}
.card .chips{margin-top:5px;gap:3px}
.card .chip{min-width:18px;height:18px;line-height:16px;font-size:10px;border-radius:9px}
.card.clash{border-color:var(--clash)}
.badge{display:inline-block;font-size:9px;font-weight:800;letter-spacing:1px;padding:2px 6px;border-radius:6px;margin-top:3px}
.badge.clash{background:rgba(255,77,77,.15);color:var(--clash)}
.badge.now{background:rgba(255,212,0,.15);color:var(--acc)}
.badge.next{background:rgba(0,229,255,.12);color:var(--acc2)}
.empty{color:var(--dim);text-align:center;padding:40px 20px;font-size:13px;line-height:1.6}
.groupt{font-size:11px;font-weight:800;letter-spacing:2px;color:var(--acc2);margin:16px 2px 8px}
.hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);color:var(--txt);font-size:12px;padding:8px 14px;border-radius:20px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;z-index:99}
.hint.show{opacity:1}
.offline{position:fixed;top:0;left:0;right:0;background:#7a2020;color:#fff;font-size:11px;text-align:center;padding:3px;z-index:200;display:none}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(5,5,10,.8);backdrop-filter:blur(4px);z-index:100;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{background:var(--bg2);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:480px}
.sheet h2{font-size:15px;letter-spacing:1px;margin-bottom:4px}
.sheet p{font-size:12px;color:var(--dim);margin-bottom:14px;line-height:1.5}
.ugrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.ugrid button{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:14px 4px;font-size:14px;font-weight:700}
.ugrid button i{font-style:normal;display:block;width:28px;height:28px;line-height:28px;border-radius:50%;margin:0 auto 6px;font-size:12px;font-weight:800;color:#111;background:var(--uc)}
.ugrid button.sel{border-color:var(--uc);box-shadow:0 0 0 1px var(--uc) inset}
.frow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.frow button{background:var(--card);border:1px solid var(--line);color:var(--dim);border-radius:16px;padding:7px 14px;font-size:13px;font-weight:700}
.frow button.sel{background:var(--uc,#333);border-color:var(--uc,#333);color:#111}
.frow button.all.sel{background:var(--txt);border-color:var(--txt)}
.sheet .close{width:100%;margin-top:4px;background:var(--acc);border:none;color:#111;font-weight:800;font-size:14px;border-radius:12px;padding:12px}
.legendrow{display:flex;gap:14px;margin-bottom:14px;font-size:11px;color:var(--dim)}
.legendrow b{color:var(--txt)}
</style>
</head>
<body>
<div class="offline" id="offline">Sin conexión — mostrando la última copia guardada</div>
<header>
  <div class="brand"><h1>DECI<b>BEL</b> 2026</h1><span>28–30 AGO</span>
    <button class="mebtn" id="meBtn" onclick="openWho(true)"></button>
  </div>
  <div class="tabs" id="dayTabs"></div>
  <div class="views">
    <button class="v on" data-v="grid">HORARIOS</button>
    <button class="v" data-v="favs">FAVORITOS<span class="cnt" id="favCnt" style="display:none">0</span></button>
    <button class="v" data-v="now">AHORA</button>
    <button class="filterbtn" id="filterBtn" onclick="openFilter()">👥 Todos</button>
  </div>
</header>
<div id="grid"></div>
<div id="favs" class="list"></div>
<div id="now" class="list"></div>
<div class="hint" id="hint"></div>

<!-- quien eres -->
<div class="overlay" id="whoOv">
  <div class="sheet">
    <h2>¿Quién eres?</h2>
    <p>Se guarda en este móvil y no se te vuelve a preguntar. Tus marcas llevarán tu inicial.</p>
    <div class="ugrid" id="whoGrid"></div>
  </div>
</div>

<!-- filtro -->
<div class="overlay" id="filterOv" onclick="if(event.target===this)closeFilter()">
  <div class="sheet">
    <h2>¿De quién quieres ver las marcas?</h2>
    <div class="legendrow"><span><b>■ Relleno</b> = imprescindible</span><span><b>□ Borde</b> = me apetece</span></div>
    <div class="frow" id="filterRow"></div>
    <button class="close" onclick="closeFilter()">Listo</button>
  </div>
</div>

const HDRS = { "apikey": KEY, "Authorization": "Bearer "+KEY, "Content-Type": "application/json" };
let pullTimer = null;
async function pull(){
  try {
    const r = await fetch(`${SB}/rest/v1/${TABLE}?select=user_name,set_id,level`, {headers: HDRS});
    if (!r.ok) throw 0;
    const rows = await r.json();
    const nm = {};
    rows.forEach(x => { (nm[x.set_id] = nm[x.set_id] || {})[x.user_name] = x.level; });
    const ser = JSON.stringify(nm);
    if (ser !== JSON.stringify(marks)) { marks = nm; lsSet("db26_marks", ser); render(); }
    $("#offline").style.display = "none";
  } catch(e) { $("#offline").style.display = "block"; }
}
async function push(id, level){
  try {
    let r;
    if (level) {
      r = await fetch(`${SB}/rest/v1/${TABLE}?on_conflict=user_name,set_id`, {
        method: "POST",
        headers: {...HDRS, "Prefer": "resolution=merge-duplicates"},
        body: JSON.stringify({user_name: me, set_id: id, level})
      });
    } else {
      r = await fetch(`${SB}/rest/v1/${TABLE}?user_name=eq.${encodeURIComponent(me)}&set_id=eq.${encodeURIComponent(id)}`, {
        method: "DELETE", headers: HDRS
      });
    }
    if (!r.ok) throw 0;
    $("#offline").style.display = "none";
  } catch(e) {
    toast("⚠ No se pudo guardar — revisa la conexión");
    pull();
  }
}

/* ---------- helpers ---------- */
function allSets(day){
  const out = [];
  day.sections.forEach(sec => sec.stages.forEach(st => st.sets.forEach(s => {
    out.push({id:setId(day.key,st.name,s), stage:st.name, ...s});
  })));
  return out;
}
function myLevel(id){ return (marks[id]||{})[me] || null; }
function visibleMarks(id){
  const m = marks[id] || {};
  return USERS.filter(u => m[u.n] && filter.includes(u.n)).map(u => ({...u, level:m[u.n]}));
}
function myClashes(day){
  const f = allSets(day).filter(s => myLevel(s.id)==="must"), bad = new Set();
  for (let i=0;i<f.length;i++) for (let j=i+1;j<f.length;j++)
    if (f[i].a < f[j].b && f[j].a < f[i].b) { bad.add(f[i].id); bad.add(f[j].id); }
  return bad;
}
function nowMin(day){
  const diff = (Date.now() - new Date(day.date+"T00:00:00").getTime())/60000;
  return (diff >= 0 && diff < 30*60) ? diff : null;
}
function stageColor(day, name){
  const names = [...new Set(day.sections.flatMap(s => s.stages.map(x => x.name)))];
  return PALETTE[names.indexOf(name) % PALETTE.length];
}
function chipsHtml(id, small){
  const vs = visibleMarks(id);
  if (!vs.length) return "";
  return `<span class="chips">` + vs.map(v =>
    `<span class="chip ${v.level==='like'?'like':''} ${v.n===me?'me':''}" style="--uc:${v.c}">${v.i}</span>`).join("") + `</span>`;
}

function renderGrid(){
  const prevScroll = [...document.querySelectorAll("#grid .gridwrap")].map(el => el.scrollLeft);
  const day = DATA[dayIdx], clashes = myClashes(day), nm = nowMin(day);
  let html = "";
  day.sections.forEach(sec => {
    const slots = (sec.g1 - sec.g0)/15, cols = sec.stages.length;
    const colW = cols <= 3 ? "minmax(140px,1fr)" : "112px";
    let g = `<div class="section"><div class="sec-title">${secLabel(sec.name)}</div><div class="gridwrap"><div class="gtable" style="grid-template-columns:52px repeat(${cols},${colW})">`;
    g += `<div class="timecol" style="z-index:30;grid-row:1;grid-column:1"></div>`;
    sec.stages.forEach((st,ci) => g += `<div class="stagehead" style="grid-row:1;grid-column:${ci+2};--sc:${stageColor(day,st.name)}">${st.name}</div>`);
    g += `<div class="timecol" style="grid-row:2;grid-column:1">`;
    for (let m=sec.g0; m<sec.g1; m+=60) g += `<div class="tlabel">${fmt(m)}</div>`;
    g += `</div>`;
    sec.stages.forEach((st,ci) => {
      g += `<div class="stagecol" style="grid-row:2;grid-column:${ci+2};height:calc(var(--slot)*${slots})">`;
      st.sets.forEach(s => {
        const id = setId(day.key, st.name, s);
        const lv = myLevel(id);
        const top = (s.a - sec.g0)/15, h = (s.b - s.a)/15;
        const cls = ["set", lv||"", clashes.has(id)?"clash":"",
          nm!=null && s.b<=nm ? "past":"", nm!=null && s.a<=nm && nm<s.b ? "nowplay":""].join(" ");
        g += `<div class="${cls}" data-id="${esc(id)}" style="top:calc(var(--slot)*${top} + 2px);height:calc(var(--slot)*${h} - 5px);--sc:${stageColor(day,st.name)}"><span>${s.n}</span><span class="t">${fmt(s.a)}–${fmt(s.b)}</span>${chipsHtml(id)}</div>`;
      });
      g += `</div>`;
    });
    g += `</div></div></div>`;
    html += g;
  });
  $("#grid").innerHTML = html;
  document.querySelectorAll("#grid .gridwrap").forEach((el,i) => { if (prevScroll[i]) el.scrollLeft = prevScroll[i]; });
}

function secLabel(n){
  return n.replace("FRIDAY","VIERNES").replace("SATURDAY","SÁBADO").replace("SUNDAY","DOMINGO")
          .replace("PRE"," · PRE-PARTY").replace("AFTER"," · AFTER");
}

function renderFavs(){
  const day = DATA[dayIdx], clashes = myClashes(day);
  const items = allSets(day).filter(s => visibleMarks(s.id).length).sort((a,b) => a.a-b.a || a.stage.localeCompare(b.stage));
  updateCnt();
  if (!items.length){
    $("#favs").innerHTML = `<div class="empty">Nadie ${filter.length===USERS.length?"":"(de los filtrados) "}ha marcado nada este día todavía.<br>Toca un set en HORARIOS: 1 toque = ★ imprescindible, 2 = ♥ me apetece.</div>`;
    return;
  }
  let h = "";
  items.forEach(s => {
    const isClash = clashes.has(s.id);
    h += `<div class="card ${isClash?'clash':''}">
      <div class="when"><b>${fmt(s.a)}</b><span>${fmt(s.b)}</span></div>
      <div class="who"><b>${s.n}</b><span class="st">${s.stage}</span>${chipsHtml(s.id)}${isClash?'<br><span class="badge clash">SOLAPE DE IMPRESCINDIBLES</span>':''}</div>
    </div>`;
  });
  const nClash = [...clashes].length;
  if (nClash) h = `<div class="empty" style="padding:6px 0 14px">⚠ Tienes ${nClash} imprescindibles que se solapan</div>` + h;
  $("#favs").innerHTML = h;
}

function renderNow(){
  const day = DATA[dayIdx], nm = nowMin(day);
  if (nm == null){
    $("#now").innerHTML = `<div class="empty">Esta vista cobra vida el ${day.title.toLowerCase()}.<br>Durante el festival verás qué suena ahora y qué viene después en cada stage.</div>`;
    return;
  }
  let cur = "", nxt = "";
  day.sections.forEach(sec => sec.stages.forEach(st => {
    const playing = st.sets.find(s => s.a<=nm && nm<s.b);
    const upcoming = st.sets.find(s => s.a>nm);
    if (playing) cur += nowCard(playing, st.name, day, `<span class="badge now">SONANDO · quedan ${Math.ceil(playing.b-nm)} min</span>`);
    if (upcoming) nxt += nowCard(upcoming, st.name, day, `<span class="badge next">EN ${Math.ceil(upcoming.a-nm)} MIN</span>`);
  }));
  $("#now").innerHTML =
    (cur ? `<div class="groupt">▶ SONANDO AHORA</div>${cur}` : "") +
    (nxt ? `<div class="groupt">⏭ SIGUIENTE POR STAGE</div>${nxt}` : "") ||
    `<div class="empty">Nada programado ahora mismo.</div>`;
}
function nowCard(s, stage, day, badge){
  const id = setId(day.key, stage, s);
  return `<div class="card"><div class="when"><b>${fmt(s.a)}</b><span>${fmt(s.b)}</span></div>
    <div class="who"><b>${s.n}</b><span class="st">${stage}</span><br>${badge}${chipsHtml(id)}</div></div>`;
}

function updateCnt(){
  let n = 0;
  Object.values(marks).forEach(m => { if (m[me]) n++; });
  const el = $("#favCnt");
  el.style.display = n ? "inline-block" : "none";
  el.textContent = n;
}

let hintT;
function toast(msg){
  const h = $("#hint");
  h.textContent = msg;
  h.classList.add("show");
  clearTimeout(hintT); hintT = setTimeout(() => h.classList.remove("show"), 1800);
}
function cycle(id){
  if (!me) { openWho(); return; }
  const cur = myLevel(id);
  const next = cur == null ? "must" : cur === "must" ? "like" : null;
  const m = marks[id] = marks[id] || {};
  if (next) m[me] = next; else delete m[me];
  lsSet("db26_marks", JSON.stringify(marks));
  push(id, next);
  const day = DATA[dayIdx];
  toast(next==="must" ? (myClashes(day).has(id) ? "★ Imprescindible — ⚠ se solapa con otro" : "★ Imprescindible")
      : next==="like" ? "♥ Me apetece" : "Marca quitada");
  render();
}

function render(){
  renderTabs(); renderMe(); renderFilterBtn(); updateCnt();
  if (view==="grid") renderGrid();
  if (view==="favs") renderFavs();
  if (view==="now") renderNow();
}
setView("grid");
if (!me) openWho();
startPolling();
setInterval(() => { if (view==="now") renderNow(); }, 30000);
</script>
